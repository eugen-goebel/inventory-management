[project]
name = "inventory-management-backend"
version = "1.0.0"
description = "FastAPI inventory service with JWT authentication, CSV import and stock level agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "PyJWT>=2.13.0",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    # fastapi.testclient builds on httpx, only the test suite needs it
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length is handled by the formatter
# B008: FastAPI's Depends()/File() default-argument idiom is intentional
ignore = ["E501", "B008"]
